mappings:
  # ========== Airflow DAG Metrics ==========
  - match: "airflow.dagrun.duration.*.*"
    name: "airflow_dagrun_duration_seconds"
    labels:
      dag_id: "$1"
      run_id: "$2"

  - match: "airflow.dagrun.*.success"
    name: "airflow_dagrun_success_total"
    labels:
      dag_id: "$1"

  - match: "airflow.dagrun.*.failed"
    name: "airflow_dagrun_failed_total"
    labels:
      dag_id: "$1"

  # ========== Airflow Task Instance Metrics ==========
  - match: "airflow.ti.duration.*.*"
    name: "airflow_task_duration_seconds"
    labels:
      dag_id: "$1"
      task_id: "$2"

  - match: "airflow.ti.successes.*.*"
    name: "airflow_ti_successes"
    labels:
      dag_id: "$1"
      task_id: "$2"

  - match: "airflow.ti.failures.*.*"
    name: "airflow_ti_failures"
    labels:
      dag_id: "$1"
      task_id: "$2"

  - match: "airflow.ti_failures"
    name: "airflow_ti_failures_total"

  - match: "airflow.ti_successes"
    name: "airflow_ti_successes_total"

  # ========== Airflow Scheduler Metrics ==========
  - match: "airflow.scheduler.heartbeat"
    name: "airflow_scheduler_heartbeat"

  - match: "airflow.scheduler_heartbeat"
    name: "airflow_scheduler_heartbeat_total"

  - match: "airflow.scheduler.tasks.running"
    name: "airflow_scheduler_tasks_running"

  - match: "airflow.scheduler.tasks.starving"
    name: "airflow_scheduler_tasks_starving"

  - match: "airflow.scheduler.tasks.executable"
    name: "airflow_scheduler_tasks_executable"

  # ========== Airflow Pool Metrics ==========
  - match: "airflow.pool.open_slots.*"
    name: "airflow_pool_open_slots"
    labels:
      pool_name: "$1"

  - match: "airflow.pool.queued_slots.*"
    name: "airflow_pool_queued_slots"
    labels:
      pool_name: "$1"

  - match: "airflow.pool.running_slots.*"
    name: "airflow_pool_running_slots"
    labels:
      pool_name: "$1"

  # ========== Airflow Executor Metrics ==========
  - match: "airflow.executor.open_slots"
    name: "airflow_executor_open_slots"

  - match: "airflow.executor.queued_tasks"
    name: "airflow_executor_queued_tasks"

  - match: "airflow.executor.running_tasks"
    name: "airflow_executor_running_tasks"

  # ========== Catchall pour les métriques non mappées ==========
  - match: "airflow.*"
    name: "airflow_unmapped_metric"
    labels:
      metric_name: "$1"