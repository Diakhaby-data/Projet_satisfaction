services:
  # ========== PostgreSQL (Airflow) ==========
  postgres:
    image: postgres:13
    container_name: airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - airflow_network
    deploy:
      resources:
        limits:
          memory: 512M

  # ========== MongoDB ==========
  mongo_service:
    image: mongo:6.0
    container_name: mongo_service
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: dkb
      MONGO_INITDB_ROOT_PASSWORD: diakhaby
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - airflow_network
    healthcheck:
      test: ["CMD", "mongosh", "--username", "dkb", "--password", "diakhaby", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ========== Airflow Webserver ==========
  airflow_webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow_webserver
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      mongo_service:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: your_secret_key_here
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 30
      AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
      AIRFLOW__CORE__PARALLELISM: 8
      AIRFLOW__CORE__DAG_CONCURRENCY: 4
      AIRFLOW__METRICS__STATSD_ON: "False"  # Désactivé pour éviter les erreurs
    volumes:
      - ./dags:/opt/airflow/dags:cached
      - ./data:/opt/airflow/data:cached
      - ./scripts:/opt/airflow/scripts:cached
      - ./app:/opt/airflow/app:cached
      - ./logs:/opt/airflow/logs:cached
      - ./plugins:/opt/airflow/plugins:cached
    ports:
      - "8080:8080"
    command: >
      bash -c "airflow db init &&
               airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true &&
               airflow webserver"
    networks:
      - airflow_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ========== Airflow Scheduler ==========
  airflow_scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow_scheduler
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      mongo_service:
        condition: service_healthy
      airflow_webserver:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 30
      AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
      AIRFLOW__CORE__PARALLELISM: 8
      AIRFLOW__CORE__DAG_CONCURRENCY: 4
      AIRFLOW__METRICS__STATSD_ON: "False"
    volumes:
      - ./dags:/opt/airflow/dags:cached
      - ./data:/opt/airflow/data:cached
      - ./scripts:/opt/airflow/scripts:cached
      - ./app:/opt/airflow/app:cached
      - ./logs:/opt/airflow/logs:cached
      - ./plugins:/opt/airflow/plugins:cached
    command: airflow scheduler
    networks:
      - airflow_network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ========== FastAPI ==========
  fastapi_service:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: fastapi_service
    restart: always
    depends_on:
      - mongo_service
    environment:
      DOCKER_ENV: "1"
      MONGO_USER: dkb
      MONGO_PASS: diakhaby
      MONGO_DB: satisfaction
      MONGO_HOST: mongo_service
      MONGO_PORT: 27017
    ports:
      - "8001:8000"
    volumes:
      - ./app:/app:cached
      - ./data:/app/data:cached
    networks:
      - airflow_network
    deploy:
      resources:
        limits:
          memory: 512M

# ========== Volumes ==========
volumes:
  postgres_data:
    driver: local
  mongo_data:
    driver: local

# ========== Networks ==========
networks:
  airflow_network:
    driver: bridge
    name: projet_satisfaction_airflow_network
